<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reading Speed Tracker</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="page">
            <header>
                <div class="header-left">
                    <h1>Reading Speed Tracker</h1>
                    <span class="subtitle">WPM · Timer · History</span>
                </div>
                <!-- Auth UI -->
                <div class="auth-area" id="authArea">
                    <!-- ログイン前 -->
                    <button class="btn-google" id="btnSignIn">
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 18 18"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
                                fill="#4285F4"
                            />
                            <path
                                d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"
                                fill="#34A853"
                            />
                            <path
                                d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"
                                fill="#FBBC05"
                            />
                            <path
                                d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"
                                fill="#EA4335"
                            />
                        </svg>
                        Googleでログイン
                    </button>
                    <!-- ログイン後 -->
                    <div class="user-info" id="userInfo" style="display: none">
                        <img
                            class="user-avatar"
                            id="userAvatar"
                            src=""
                            alt=""
                        />
                        <span class="user-name" id="userName"></span>
                        <button class="btn-signout" id="btnSignOut">
                            ログアウト
                        </button>
                    </div>
                </div>
            </header>

            <!-- 未ログイン時の案内バナー -->
            <div class="auth-banner" id="authBanner">
                <span class="auth-banner-icon">☁</span>
                Googleでログインすると、履歴がクラウドに保存されどのデバイスでも共有されます。ログインしない場合はこのブラウザのみに保存されます。
            </div>

            <!-- Input -->
            <div class="input-area" id="inputArea">
                <div class="section-label">英語テキストを貼り付ける</div>
                <textarea
                    id="textInput"
                    placeholder="Paste your English text here and press Start when you're ready to read…"
                    spellcheck="false"
                ></textarea>
            </div>

            <!-- Reading view -->
            <div class="reading-display" id="readingDisplay"></div>

            <!-- Timer + buttons -->
            <div class="timer-row">
                <div class="pulse-dot" id="pulseDot"></div>
                <div class="timer-display" id="timerDisplay">0:00.0</div>
            </div>

            <div class="btn-row">
                <button class="btn btn-start" id="btnStart">▶ 開始</button>
                <button class="btn btn-stop" id="btnStop">■ 終了</button>
                <button class="btn btn-reset" id="btnReset">↺ リセット</button>
            </div>

            <hr class="divider" />

            <!-- History -->
            <div class="history-header">
                <div class="history-title">セッション履歴</div>
                <div class="history-count" id="historyCount"></div>
            </div>

            <div class="history-scroll">
                <div class="history-list" id="historyList">
                    <div class="history-empty" id="historyEmpty">
                        まだ記録がありません。テキストを貼り付けて開始してください。
                    </div>
                </div>
            </div>
        </div>

        <!-- Firebase SDK (v9 compat) -->
        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
        <script src="script.js"></script>
    </body>
</html>
