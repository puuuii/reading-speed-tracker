<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Speed Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header>
    <h1>Reading Speed Tracker</h1>
    <span class="subtitle">WPM · Timer · History</span>
  </header>

  <!-- Input -->
  <div class="input-area" id="inputArea">
    <div class="section-label">英語テキストを貼り付ける</div>
    <textarea
      id="textInput"
      placeholder="Paste your English text here and press Start when you're ready to read…"
      spellcheck="false"
    ></textarea>
  </div>

  <!-- Reading view -->
  <div class="reading-display" id="readingDisplay"></div>

  <!-- Timer + buttons -->
  <div class="timer-row">
    <div class="pulse-dot" id="pulseDot"></div>
    <div class="timer-display" id="timerDisplay">0:00.0</div>
  </div>

  <div class="btn-row">
    <button class="btn btn-start" id="btnStart">▶ 開始</button>
    <button class="btn btn-stop"  id="btnStop">■ 終了</button>
    <button class="btn btn-reset" id="btnReset">↺ リセット</button>
  </div>

  <hr class="divider">

  <!-- History -->
  <div class="history-header">
    <div class="history-title">セッション履歴</div>
    <div class="history-count" id="historyCount"></div>
  </div>

  <div class="history-scroll">
    <div class="history-list" id="historyList">
      <div class="history-empty" id="historyEmpty">まだ記録がありません。テキストを貼り付けて開始してください。</div>
    </div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
